name: Frontend DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'devops-bootcamp-linker-frontend/**'

jobs:
  notify-start:
    name: Notify Pipeline Start
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification on Push
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: github-notifications
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: |
            Event: ${{ github.event_name }}
            Actor: ${{ github.actor }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          SLACK_TITLE: "🚀 Frontend DevSecOps Pipeline Started"
          MSG_MINIMAL: true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: notify-start
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: devops-bootcamp-linker-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: devops-bootcamp-linker-frontend

      - name: Run ESLint
        run: npx eslint . --format=json --output-file=eslint-report.json || true
        working-directory: devops-bootcamp-linker-frontend

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: devops-bootcamp-linker-frontend/eslint-report.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: devops-bootcamp-linker-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: devops-bootcamp-linker-frontend

      - name: Run tests
        run: npm test -- --coverage --watchAll=false
        working-directory: devops-bootcamp-linker-frontend
        continue-on-error: true

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: devops-bootcamp-linker-frontend/coverage/

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: devops-bootcamp-linker-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: devops-bootcamp-linker-frontend

      - name: Run npm audit
        run: npm audit --json > npm-audit-report.json || npm audit --json > npm-audit-report.json
        working-directory: devops-bootcamp-linker-frontend
        continue-on-error: true

      - name: Check for critical vulnerabilities
        run: |
          if npm audit --audit-level=critical --json | grep -q '"auditLevel":"critical"'; then
            echo "Critical vulnerabilities found!"
            exit 1
          fi
        working-directory: devops-bootcamp-linker-frontend
        continue-on-error: true

      - name: Upload SCA Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: devops-bootcamp-linker-frontend/npm-audit-report.json

  sast:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run semgrep
        run: |
          semgrep scan \
            --config=auto \
            --json \
            --output=semgrep-results.json \
            devops-bootcamp-linker-frontend/ || true
        continue-on-error: true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sca, sast]
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "SCA Report: npm audit completed" >> $GITHUB_STEP_SUMMARY
          echo "SAST Report: semgrep scan completed" >> $GITHUB_STEP_SUMMARY

  pipeline-result:
    name: Pipeline Result Notification
    runs-on: ubuntu-latest
    needs: [lint, test, sca, sast, security-summary]
    if: always()
    steps:
      - name: Determine Pipeline Status
        id: status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.sca.result }}" == "failure" ] || [ "${{ needs.sast.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification - Pipeline Complete
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: github-notifications
          SLACK_COLOR: ${{ steps.status.outputs.color }}
          SLACK_TITLE: "${{ steps.status.outputs.emoji }} Frontend DevSecOps Pipeline ${{ steps.status.outputs.status }}"
          SLACK_MESSAGE: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Lint: ${{ needs.lint.result }}
            Tests: ${{ needs.test.result }}
            SCA: ${{ needs.sca.result }}
            SAST: ${{ needs.sast.result }}
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MSG_MINIMAL: false
